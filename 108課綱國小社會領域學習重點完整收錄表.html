    let currentDimension = 'all'; // all, performance, content
    let currentStage = 'all';     // all, mid, high
    let currentSubcat = 'all';
    let searchQuery = '';

    function setDimension(dim) {
      currentDimension = dim;
      currentSubcat = 'all';
      ['all', 'performance', 'content'].forEach(d => {
        const btn = document.getElementById(`dim-${d}`);
        if (d === dim) {
          btn.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black transition pill-active';
        } else {
          btn.className = 'px-3.5 py-1.5 rounded-xl text-xs font-bold text-slate-600 hover:text-slate-900 transition';
        }
      });
      renderSubcatBar();
      renderList();
    }

    function setStage(stage) {
      currentStage = stage;
      ['all', 'mid', 'high'].forEach(s => {
        const btn = document.getElementById(`stage-${s}`);
        if (s === stage) {
          btn.className = 'px-3 py-1.5 rounded-xl font-bold bg-slate-800 text-white';
        } else {
          btn.className = 'px-3 py-1.5 rounded-xl font-bold bg-slate-100 hover:bg-slate-200 text-slate-700';
        }
      });
      renderList();
    }

    function setSubcat(cat) {
      currentSubcat = cat;
      renderSubcatBar();
      renderList();
    }

    function renderSubcatBar() {
      const bar = document.getElementById('subcat-bar');
      if (currentDimension === 'performance') {
        const categories = ['全部構面', '1. 理解及思辨', '2. 態度及價值', '3. 實作及參與'];
        bar.innerHTML = `
          <span class="text-[11px] font-bold text-indigo-900 mr-1 flex items-center gap-1">
            <i class="fa-solid fa-filter"></i>表現構面直達：
          </span>
          ${categories.map(c => `
            <button onclick="setSubcat('${c}')" class="px-2.5 py-1 rounded-lg text-xs font-bold border transition ${currentSubcat === c ? 'bg-indigo-900 text-white border-indigo-950' : 'bg-indigo-50/70 hover:bg-indigo-100 text-indigo-900 border-indigo-200'}">
              ${c}
            </button>
          `).join('')}
        `;
      } else if (currentDimension === 'content') {
        const categories = ['全部主題', '主題軸 A · 互動與關聯', '主題軸 B · 差異與多元', '主題軸 C · 變遷與因果', '主題軸 D · 選擇與責任'];
        bar.innerHTML = `
          <span class="text-[11px] font-bold text-emerald-900 mr-1 flex items-center gap-1">
            <i class="fa-solid fa-filter"></i>內容主題直達：
          </span>
          ${categories.map(c => `
            <button onclick="setSubcat('${c}')" class="px-2.5 py-1 rounded-lg text-xs font-bold border transition ${currentSubcat === c ? 'bg-emerald-900 text-white border-emerald-950' : 'bg-emerald-50/70 hover:bg-emerald-100 text-emerald-900 border-emerald-200'}">
              ${c}
            </button>
          `).join('')}
        `;
      } else {
        bar.innerHTML = `
          <span class="text-[11px] font-bold text-slate-500 flex items-center gap-1">
            <i class="fa-solid fa-lightbulb text-amber-500"></i>提示：切換上方「學習表現」或「學習內容」可啟用構面或主題軸一鍵直達過濾。
          </span>
        `;
      }
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.trim();
      renderList();
    }

    function renderList() {
      const container = document.getElementById('item-container');
      const filtered = CURRICULUM_DATA.filter(item => {
        const matchDim = (currentDimension === 'all') || (item.dimension === currentDimension);
        const matchStage = (currentStage === 'all') || (item.stage === currentStage);
        const matchSubcat = (currentSubcat === 'all' || currentSubcat === '全部構面' || currentSubcat === '全部主題') || 
                            (item.mainCat.includes(currentSubcat) || currentSubcat.includes(item.mainCat));
        const matchSearch = (!searchQuery) || 
          item.code.toLowerCase().includes(searchQuery.toLowerCase()) || 
          item.text.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.mainCat.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.subCat.toLowerCase().includes(searchQuery.toLowerCase());
        return matchDim && matchStage && matchSubcat && matchSearch;
      });

      document.getElementById('result-count').textContent = filtered.length;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 font-bold text-sm bg-white rounded-3xl border-2 border-slate-200">查無符合條件之課綱條目，請嘗試調整搜尋條件。</div>`;
        return;
      }

      // 如果當前是全部或兩者皆有，按維度與類別分組展示，讓閱讀更有條理
      container.innerHTML = filtered.map(item => `
        <div class="bg-white border-2 border-slate-800 rounded-2xl p-4 shadow-[0_3px_0_#2d3748] transition hover:translate-x-1">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
            <div class="flex items-center gap-2">
              <span class="code-badge font-black text-xs px-2.5 py-1 rounded-lg ${item.dimension === 'performance' ? 'bg-indigo-100 text-indigo-950 border border-indigo-300' : 'bg-emerald-100 text-emerald-950 border border-emerald-300'}">
                ${item.code}
              </span>
              <span class="text-xs font-black ${item.dimension === 'performance' ? 'text-indigo-800' : 'text-emerald-800'}">
                ${item.mainCat}
              </span>
              <span class="text-xs text-slate-400">/</span>
              <span class="text-xs font-bold text-slate-600">${item.subCat}</span>
            </div>
            
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] font-black px-2 py-0.5 rounded-full ${item.dimension === 'performance' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}">
                ${item.dimension === 'performance' ? '學習表現' : '學習內容'}
              </span>
              <span class="text-[10px] font-black px-2 py-0.5 rounded-full ${item.stage === 'mid' ? 'bg-amber-100 text-amber-900 border border-amber-300' : 'bg-sky-100 text-sky-900 border border-sky-300'}">
                ${item.stage === 'mid' ? '中年級(Ⅱ)' : '高年級(Ⅲ)'}
              </span>
            </div>
          </div>
          <p class="text-sm text-slate-800 leading-relaxed font-bold pl-0.5">${item.text}</p>
        </div>
      `).join('');
    }

    // 初始化執行
    renderSubcatBar();
    renderList();
  </script>
</body>
</html>
